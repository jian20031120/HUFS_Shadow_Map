<div class="location-controls" data-location-controls>
  <p class="origin-label">출발 · 현재 위치</p>
  <div class="control-row" role="group" aria-label="지도 시간과 내 위치">
    <button class="locate-button" type="button" data-locate>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
      <span data-locate-label>내 위치로 찾기</span>
    </button>
    <label class="time-control">
      <span class="screen-reader-only">그늘을 볼 시간</span>
      <select aria-label="그늘을 볼 시간" data-time-mode>
        <option value="current">현재 시각</option>
        <option value="morning">오전 9시</option>
        <option value="noon">정오 12시</option>
        <option value="afternoon">오후 3시</option>
      </select>
    </label>
    <button class="clear-button" type="button" aria-label="위치 지우기" title="위치 지우기" data-clear-location disabled>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg>
    </button>
  </div>
  <p class="location-status" role="status" aria-live="polite" data-location-status hidden></p>
</div>
